# Triangle Property Theorems - Week 8
# Theorems about triangle properties and relationships

theorems:
  # 1. Isosceles Triangle - Converse
  - name: "isosceles_converse"
    category: "triangle_properties"
    description: "If two base angles of a triangle are equal, then the triangle is isosceles (converse of isosceles base angles)"

    conditions:
      - type: "Triangle"
        p1: "?A"
        p2: "?B"
        p3: "?C"
      - type: "EqualAngle"
        angle1: "?ABC"
        angle2: "?ACB"

    conclusions:
      - type: "EqualSegment"
        segment1: "?AB"
        segment2: "?AC"
      - type: "IsoscelesTriangle"
        p1: "?A"
        p2: "?B"
        p3: "?C"

    variables:
      - name: "?A"
        type: "point"
        description: "Apex vertex"
      - name: "?B"
        type: "point"
        description: "Base vertex 1"
      - name: "?C"
        type: "point"
        description: "Base vertex 2"
      - name: "?AB"
        type: "segment"
        derived_from: ["?A", "?B"]
      - name: "?AC"
        type: "segment"
        derived_from: ["?A", "?C"]
      - name: "?ABC"
        type: "angle"
        derived_from: ["?A", "?B", "?C"]
      - name: "?ACB"
        type: "angle"
        derived_from: ["?A", "?C", "?B"]

  # 2. Equilateral Triangle - All Angles Equal
  - name: "equilateral_all_angles_equal"
    category: "triangle_properties"
    description: "In an equilateral triangle, all angles are equal"

    conditions:
      - type: "EquilateralTriangle"
        p1: "?A"
        p2: "?B"
        p3: "?C"

    conclusions:
      - type: "EqualAngle"
        angle1: "?ABC"
        angle2: "?BCA"
      - type: "EqualAngle"
        angle1: "?ABC"
        angle2: "?CAB"
      - type: "EqualAngle"
        angle1: "?BCA"
        angle2: "?CAB"

    variables:
      - name: "?A"
        type: "point"
      - name: "?B"
        type: "point"
      - name: "?C"
        type: "point"
      - name: "?ABC"
        type: "angle"
        derived_from: ["?A", "?B", "?C"]
      - name: "?BCA"
        type: "angle"
        derived_from: ["?B", "?C", "?A"]
      - name: "?CAB"
        type: "angle"
        derived_from: ["?C", "?A", "?B"]

  # 3. Equilateral Triangle - All Sides Equal
  - name: "equilateral_all_sides_equal"
    category: "triangle_properties"
    description: "In an equilateral triangle, all sides are equal (reflexive property)"

    conditions:
      - type: "EquilateralTriangle"
        p1: "?A"
        p2: "?B"
        p3: "?C"

    conclusions:
      - type: "EqualSegment"
        segment1: "?AB"
        segment2: "?BC"
      - type: "EqualSegment"
        segment1: "?BC"
        segment2: "?CA"
      - type: "EqualSegment"
        segment1: "?AB"
        segment2: "?CA"

    variables:
      - name: "?A"
        type: "point"
      - name: "?B"
        type: "point"
      - name: "?C"
        type: "point"
      - name: "?AB"
        type: "segment"
        derived_from: ["?A", "?B"]
      - name: "?BC"
        type: "segment"
        derived_from: ["?B", "?C"]
      - name: "?CA"
        type: "segment"
        derived_from: ["?C", "?A"]

  # 4. Isosceles Triangle - Sides Imply Shape
  - name: "equal_sides_make_isosceles"
    category: "triangle_properties"
    description: "If two sides of a triangle are equal, it is isosceles"

    conditions:
      - type: "Triangle"
        p1: "?A"
        p2: "?B"
        p3: "?C"
      - type: "EqualSegment"
        segment1: "?AB"
        segment2: "?AC"

    conclusions:
      - type: "IsoscelesTriangle"
        p1: "?A"
        p2: "?B"
        p3: "?C"

    variables:
      - name: "?A"
        type: "point"
        description: "Apex vertex"
      - name: "?B"
        type: "point"
        description: "Base vertex 1"
      - name: "?C"
        type: "point"
        description: "Base vertex 2"
      - name: "?AB"
        type: "segment"
        derived_from: ["?A", "?B"]
      - name: "?AC"
        type: "segment"
        derived_from: ["?A", "?C"]

  # 5. Isosceles Triangle - Altitude Bisects Base
  - name: "isosceles_altitude_bisects_base"
    category: "triangle_properties"
    description: "In isosceles triangle, altitude from apex to base bisects the base"

    conditions:
      - type: "IsoscelesTriangle"
        p1: "?A"
        p2: "?B"
        p3: "?C"
      - type: "FootOfPerpendicular"
        foot: "?D"
        point: "?A"
        line: "?BC"

    conclusions:
      - type: "Midpoint"
        midpoint: "?D"
        point1: "?B"
        point2: "?C"
      - type: "EqualSegment"
        segment1: "?BD"
        segment2: "?DC"

    variables:
      - name: "?A"
        type: "point"
        description: "Apex vertex"
      - name: "?B"
        type: "point"
        description: "Base vertex 1"
      - name: "?C"
        type: "point"
        description: "Base vertex 2"
      - name: "?D"
        type: "point"
        description: "Foot of altitude from A to BC"
      - name: "?BC"
        type: "line"
        derived_from: ["?B", "?C"]
      - name: "?BD"
        type: "segment"
        derived_from: ["?B", "?D"]
      - name: "?DC"
        type: "segment"
        derived_from: ["?D", "?C"]

  # 6. Isosceles Triangle - Altitude Bisects Apex Angle
  - name: "isosceles_altitude_bisects_angle"
    category: "triangle_properties"
    description: "In isosceles triangle, altitude from apex bisects the apex angle"

    conditions:
      - type: "IsoscelesTriangle"
        p1: "?A"
        p2: "?B"
        p3: "?C"
      - type: "FootOfPerpendicular"
        foot: "?D"
        point: "?A"
        line: "?BC"

    conclusions:
      - type: "AngleBisector"
        bisector: "?AD"
        vertex: "?A"
        ray1: "?B"
        ray2: "?C"
      - type: "EqualAngle"
        angle1: "?BAD"
        angle2: "?DAC"

    variables:
      - name: "?A"
        type: "point"
        description: "Apex vertex"
      - name: "?B"
        type: "point"
        description: "Base vertex 1"
      - name: "?C"
        type: "point"
        description: "Base vertex 2"
      - name: "?D"
        type: "point"
        description: "Foot of altitude"
      - name: "?AD"
        type: "line"
        derived_from: ["?A", "?D"]
      - name: "?BC"
        type: "line"
        derived_from: ["?B", "?C"]
      - name: "?BAD"
        type: "angle"
        derived_from: ["?B", "?A", "?D"]
      - name: "?DAC"
        type: "angle"
        derived_from: ["?D", "?A", "?C"]

  # 7. Isosceles Triangle - Equal Sides Have Equal Midpoint Distances
  - name: "isosceles_equal_midpoints"
    category: "triangle_properties"
    description: "In isosceles triangle AB=AC, midpoints of equal sides are equidistant from apex"

    conditions:
      - type: "IsoscelesTriangle"
        p1: "?A"
        p2: "?B"
        p3: "?C"
      - type: "Midpoint"
        midpoint: "?E"
        point1: "?A"
        point2: "?B"
      - type: "Midpoint"
        midpoint: "?F"
        point1: "?A"
        point2: "?C"

    conclusions:
      - type: "EqualSegment"
        segment1: "?AE"
        segment2: "?AF"

    variables:
      - name: "?A"
        type: "point"
        description: "Apex vertex"
      - name: "?B"
        type: "point"
        description: "Base vertex 1"
      - name: "?C"
        type: "point"
        description: "Base vertex 2"
      - name: "?E"
        type: "point"
        description: "Midpoint of AB"
      - name: "?F"
        type: "point"
        description: "Midpoint of AC"
      - name: "?AE"
        type: "segment"
        derived_from: ["?A", "?E"]
      - name: "?AF"
        type: "segment"
        derived_from: ["?A", "?F"]
